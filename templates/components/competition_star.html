<form method="post" action="{% url 'main:toggle_competition_star' competition.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in competition.starred_by.all %} is-starred{% endif %}"
            title="{% if competition.starred_by.all %}Starred by {{ competition.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in competition.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ competition.starred_by.count }}</span>
    </button>
</form>
