<div id="add-competition-modal"
     class="competition-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-competition-modal-title">
    <button type="button"
            class="competition-form-modal__backdrop"
            popovertarget="add-competition-modal"
            popovertargetaction="hide"
            aria-label="Close add competition form"></button>

    <div class="competition-form-modal__content">
        <button type="button"
                class="competition-form-modal__close"
                popovertarget="add-competition-modal"
                popovertargetaction="hide"
                aria-label="Close add competition form">×</button>

        <h2 id="add-competition-modal-title">Add a New Competition</h2>
        <form id="competition-form"
              method="post"
              action="{% url 'main:create_competition' %}"
              class="competition-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="competition-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-competition-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Competition</button>
            </div>
        </form>
    </div>
</div>
