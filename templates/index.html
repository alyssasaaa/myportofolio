{% extends 'base.html' %}
{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <img class="avatar" src="/static/img/SASARAINBOW.png" alt="Photo of {{ nickname }}">
            </div>
            <div class="hero-details">
                <p class="bio">{{ bio }}</p>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="https://github.com/alyssasaaa" class="social-link">GitHub</a>
                    <a href="https://id.linkedin.com/in/alyssa-rahma-adjani-bb0410378" class="social-link">LinkedIn</a>
                    <a href="mailto:alyssaadjani1@gmail.com" class="social-link">Email</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
